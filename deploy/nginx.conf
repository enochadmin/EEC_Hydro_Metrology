# EEC-BHDMS — nginx server block
#
# Assumes the application is deployed to /var/www/eec-bhdms and PHP-FPM 8.2 is
# listening on the socket below. DocumentRoot is `public`, never the project root.

server {
    listen 80;
    server_name bhdms.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bhdms.example.org;

    root /var/www/eec-bhdms/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/bhdms.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bhdms.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 32m;   # matches excel.limits.max_upload_kb (30 MB) plus headroom

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
    }

    # Private exports and backups are never served directly.
    location ~ ^/(storage|build/manifest\.json) {
        deny all;
    }

    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|webp|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
