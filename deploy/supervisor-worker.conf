; EEC-BHDMS queue worker
;
; Install as /etc/supervisor/conf.d/eec-bhdms-worker.conf, then:
;   sudo supervisorctl reread && sudo supervisorctl update
;
; The queue carries workbook transformation and long exports. Two workers keep
; a large import from blocking a report download.

[program:eec-bhdms-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/eec-bhdms/artisan queue:work --sleep=3 --tries=2 --timeout=1800 --max-time=3600
directory=/var/www/eec-bhdms
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/eec-bhdms/storage/logs/worker.log
stopwaitsecs=3600
